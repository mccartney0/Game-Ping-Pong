import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'GamePingPongTouch'
include ':core', ':android', ':lwjgl3', ':release-updater'
project(':release-updater').projectDir = new File(settingsDir, '../release-updater')
