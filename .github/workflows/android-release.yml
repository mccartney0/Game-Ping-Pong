name: Build Android release AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  GAME_SERVICES_PROJECT_ID: ${{ secrets.GAME_SERVICES_PROJECT_ID }}
  LEADERBOARD_MUTANT_ARENA_SCORE: ${{ secrets.LEADERBOARD_MUTANT_ARENA_SCORE }}
  LEADERBOARD_CAMPAIGN_BOSSES: ${{ secrets.LEADERBOARD_CAMPAIGN_BOSSES }}
  LEADERBOARD_SURVIVAL_SCORE: ${{ secrets.LEADERBOARD_SURVIVAL_SCORE }}
  LEADERBOARD_SPEED_RUN_MS: ${{ secrets.LEADERBOARD_SPEED_RUN_MS }}
  LEADERBOARD_BEST_COMBO: ${{ secrets.LEADERBOARD_BEST_COMBO }}
  ACHIEVEMENT_FIRST_POINT: ${{ secrets.ACHIEVEMENT_FIRST_POINT }}
  ACHIEVEMENT_MATCH_WIN: ${{ secrets.ACHIEVEMENT_MATCH_WIN }}
  ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
  BANNER_AD_UNIT_ID: ${{ secrets.BANNER_AD_UNIT_ID }}
  REWARDED_AD_UNIT_ID: ${{ secrets.REWARDED_AD_UNIT_ID }}
  VERSION_CODE: ${{ vars.ANDROID_VERSION_CODE || github.run_number }}
  VERSION_NAME: ${{ vars.ANDROID_VERSION_NAME || '1.0.0' }}

jobs:
  release-aab:
    name: Compile signed Android release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: libgdx-touch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        working-directory: .

      - name: Validate release configuration
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$GAME_SERVICES_PROJECT_ID"
          test -n "$LEADERBOARD_MUTANT_ARENA_SCORE"
          test -n "$LEADERBOARD_CAMPAIGN_BOSSES"
          test -n "$LEADERBOARD_SURVIVAL_SCORE"
          test -n "$LEADERBOARD_SPEED_RUN_MS"
          test -n "$LEADERBOARD_BEST_COMBO"
          test -n "$ACHIEVEMENT_FIRST_POINT"
          test -n "$ACHIEVEMENT_MATCH_WIN"
          test -n "$ADMOB_APP_ID"
          test -n "$BANNER_AD_UNIT_ID"
          test -n "$REWARDED_AD_UNIT_ID"

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/game-ping-pong-upload.jks"
          chmod 600 "$RUNNER_TEMP/game-ping-pong-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/game-ping-pong-upload.jks" >> "$GITHUB_ENV"

      - name: Run core tests
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Build signed release AAB
        run: ./gradlew :android:bundleRelease --no-daemon --stacktrace

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: game-ping-pong-release-aab
          path: libgdx-touch/android/build/outputs/bundle/release/android-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload release reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: game-ping-pong-release-reports
          path: |
            libgdx-touch/**/build/reports/**
            libgdx-touch/**/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
