name: Build Android APK

on:
  push:
    branches: [ master ]
    paths:
      - 'libgdx-touch/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'libgdx-touch/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile libGDX Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: libgdx-touch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        working-directory: .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Run core unit and stress tests
        run: ./gradlew :core:test :core:build --no-daemon --stacktrace

      - name: Compile Android debug APK
        run: ./gradlew :android:assembleDebug --no-daemon --stacktrace

      - name: Run Android UI instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86
          profile: pixel_2
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-linux-hw-accel: true
          disable-animations: true
          script: cd libgdx-touch && ./gradlew :android:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: game-ping-pong-touch-debug-apk
          path: libgdx-touch/android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: game-ping-pong-touch-gradle-reports
          path: |
            libgdx-touch/**/build/reports/**
            libgdx-touch/**/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
